.container {

  display: flex;
  flex-wrap: wrap;       /* 入りきらないときは次の行へ */
  justify-content: center; /* 真ん中に並べる */
  gap: 80px;             /* ロゴ同士の隙間 */
  padding: 50px 100px 50px 100px;   /* 上のポータル画像との距離 */
  max-width: 900px;
  margin: 0 auto;
}

/* すべてのロゴに共通の設定 */
.logo-item {
  display: flex;
  flex-direction: column; /* 画像と文字を縦に並べる */
  align-items: center;
  text-decoration: none;
  color: black;
  font-size: 18px; /* 文字を少し調整 */
  font-weight: bold;
}

/* 画像の設定（ここを一箇所いじるだけで全部のサイズが変わる！） */
/* 画像の設定 */
.logo-item img {
  width: 120px; 
  height: 120px;      /* 高さを固定する */
  object-fit: contain; /* 枠の中で画像が切れないように収める */
  transition: transform 0.3s;
  border-radius: 18px;
  background-color: rgba(255,255,255,0.5); /* 任意：背景を少し白くするとサイズ感が揃って見えます */
}

.logo-item:hover img {
  transform: scale(1.1);
}

a {
